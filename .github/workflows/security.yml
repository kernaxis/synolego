name: Security
'on':
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
  workflow_dispatch: null
  schedule:
  - cron: 17 5 * * *
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: security-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: govulncheck (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.release && '["amd64","386","arm","arm64"]' || '["amd64"]') }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Check reachable vulnerabilities
      uses: kernaxis/ci-actions/govulncheck@4c73aaf504f009b51ae37c1b46e948b448e957eb # v0.1.0
      with:
        report: ${{ github.ref == 'refs/heads/main' && !inputs.release && inputs.ref == '' }}
      env:
        GOOS: linux
        GOARCH: ${{ matrix.arch }}
        GOARM: '7'
        CGO_ENABLED: '0'
        GOFLAGS: -mod=readonly
  workflow-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'schedule'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref || github.sha }}
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: go.mod
    - name: Lint and audit workflows
      uses: kernaxis/ci-actions/workflow-lint@4c73aaf504f009b51ae37c1b46e948b448e957eb # v0.1.0
      with:
        report: ${{ github.ref == 'refs/heads/main' && !inputs.release && inputs.ref == '' }}
  finding-issues:
    if: always() && github.ref == 'refs/heads/main' && !inputs.release && inputs.ref == ''
    needs: [workflow-security, govulncheck]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    concurrency:
      group: security-finding-issues
      cancel-in-progress: false
    steps:
    - name: Reconcile finding issues
      uses: kernaxis/ci-actions/security-issues-sync@4c73aaf504f009b51ae37c1b46e948b448e957eb # v0.1.0
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
